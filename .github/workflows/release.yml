# PUBLICACION VERSIONADA: al crear una etiqueta vX.Y.Z se ejecuta la CI completa, se publica la imagen en el registro de GitHub
# (con procedencia y SBOM), se crea la Release con el manifiesto del modelo y se despliega al entorno staging.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    name: Integración continua
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Publicar imagen y Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetas de la imagen (semver y commit)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Sistema de Expedientes con IA (FASE III)
            org.opencontainers.image.description=API de clasificacion de documentos escolares con OCR y modelo TF-IDF + LinearSVC
      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Crear la Release con el manifiesto del modelo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" modelo/MANIFIESTO_MODELO.json modelo/metricas_referencia.json --generate-notes --title "${GITHUB_REF_NAME}"
      - name: Resumen
        run: |
          {
            echo "### Publicado"
            echo "- Imagen: \`ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}\`"
            echo "- Huella (digest): \`${{ steps.build.outputs.digest }}\`"
            echo "- Release con el manifiesto del modelo: ${GITHUB_REF_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"

  desplegar-staging:
    name: Despliegue continuo a staging
    needs: publicar
    uses: ./.github/workflows/desplegar.yml
    with:
      entorno: staging
    permissions:
      contents: read
      packages: read
